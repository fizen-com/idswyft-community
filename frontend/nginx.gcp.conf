map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/docs? {
        if ($http_accept ~* "text/plain|text/markdown") {
            rewrite ^ /llms-full.txt last;
        }
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy → idswyft API (Cloud Run, custom domain).
    # Uses a variable + resolver so nginx starts even before kyc-api.fizen.com
    # is mapped (resolution happens at request time, not config load).
    location /api/ {
        resolver 169.254.169.254 8.8.8.8 valid=30s ipv6=off;
        set $api_host kyc-api.fizen.com;
        proxy_pass https://$api_host$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name kyc-api.fizen.com;
        proxy_http_version 1.1;
        proxy_set_header Host kyc-api.fizen.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Origin "";
        client_max_body_size 20M;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://docs.opencv.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' data: blob:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
