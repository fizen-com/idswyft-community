app = "idswyft-engine-preprod"
primary_region = "fra"

[build]
  dockerfile = "engine/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3002"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3002
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[[vm]]
  size = "performance-2x"
  memory = "4gb"
